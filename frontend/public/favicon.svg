<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Nocturne at sixteen pixels: a window at night, rain across it, and
       one sodium lamp — the only warm thing, as everywhere else. -->
  <defs>
    <radialGradient id="glow" cx="0.62" cy="0.38" r="0.5">
      <stop offset="0" stop-color="#f0c892" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#d98f3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d98f3c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pane"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#pane)">
    <rect width="64" height="64" fill="#0a1416"/>
    <rect width="64" height="64" fill="url(#glow)"/>
    <circle cx="39.5" cy="24.5" r="5" fill="#f0c892"/>
    <g stroke="#c6e0e4" stroke-width="1.6" stroke-linecap="round" opacity="0.4">
      <line x1="12" y1="6" x2="7" y2="30"/>
      <line x1="24" y1="30" x2="19" y2="56"/>
      <line x1="52" y1="36" x2="47" y2="60"/>
    </g>
    <!-- the seam -->
    <line x1="24" y1="0" x2="24" y2="64" stroke="#7e8e90" stroke-width="1" opacity="0.45"/>
  </g>
</svg>
