version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: tummile
      POSTGRES_PASSWORD: REPLACE_ME
      POSTGRES_DB: tummile
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tummile -d tummile"]
      interval: 2s
      timeout: 5s
      retries: 5

volumes:
  pgdata: